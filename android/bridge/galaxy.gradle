// Applied to the Godot 4.7.2 Android export template by tools/prepare_android.sh.
def sampleApp = 'ca-app-pub-3940256099942544~3347511713'
def admobApp = System.getenv('GALAXY_ADMOB_APP_ID') ?: sampleApp
def placements = ['bonus', 'double', 'revive', 'boss', 'materials']
def unitIds = placements.collectEntries { placement ->
    [(placement): System.getenv('GALAXY_ADMOB_REWARDED_' + placement.toUpperCase(Locale.ROOT)) ?: '']
}
if (!(admobApp ==~ /ca-app-pub-[0-9]+~[0-9]+/)) {
    throw new GradleException('Invalid GALAXY_ADMOB_APP_ID')
}
if (!unitIds.values().findAll { it }.every { it ==~ /ca-app-pub-[0-9]+\/[0-9]+/ }) {
    throw new GradleException('Invalid Rewarded unit ID')
}
def purchaseServer = System.getenv('GALAXY_PURCHASE_SERVER') ?: ''
def playMode = System.getenv('GALAXY_PLAY_MODE') ?: 'test'
def licenseCheckout = System.getenv('GALAXY_ENABLE_LICENSE_CHECKOUT') == '1'
def draftCatalog = System.getenv('GALAXY_ENABLE_DRAFT_CATALOG') == '1'
if (playMode != 'test') {
    throw new GradleException('Galaxy Strike release candidates use test mode')
}
if (purchaseServer && !(purchaseServer ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9_\/-]+)?\/?/)) {
    throw new GradleException('GALAXY_PURCHASE_SERVER must be an HTTPS origin or base path')
}
if (licenseCheckout && !purchaseServer) {
    throw new GradleException('License checkout requires test mode and a verification server')
}
if (draftCatalog && !licenseCheckout) {
    throw new GradleException('Draft SKU require license checkout')
}
def privacyPolicy = System.getenv('GALAXY_PRIVACY_POLICY_URL') ?: ''
if (privacyPolicy && !(privacyPolicy ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9._~\/-]+)?/)) {
    throw new GradleException('GALAXY_PRIVACY_POLICY_URL must be an HTTPS page URL')
}
if (!privacyPolicy && (playMode == 'live' || admobApp != sampleApp)) {
    throw new GradleException('Configure the public privacy policy URL for a live integration')
}
def umpTestDevice = System.getenv('GALAXY_UMP_DEBUG_DEVICE') ?: ''
def umpGeography = System.getenv('GALAXY_UMP_DEBUG_GEOGRAPHY') ?: ''
if ((umpTestDevice || umpGeography) && (!(umpTestDevice ==~ /[A-Fa-f0-9]{32}/)
        || !(umpGeography in ['eea', 'us', 'other']))) {
    throw new GradleException('UMP debug geography requires a test device hash and eea, us, or other')
}

android {
    sourceSets.main.java.srcDir(rootProject.file('../bridge/src'))
    defaultConfig {
        manifestPlaceholders.putAll([
            galaxyAdmobAppId: admobApp,
            galaxyRewardedBonus: unitIds.bonus,
            galaxyRewardedDouble: unitIds.double,
            galaxyRewardedRevive: unitIds.revive,
            galaxyRewardedBoss: unitIds.boss,
            galaxyRewardedMaterials: unitIds.materials,
            galaxyPurchaseServer: purchaseServer,
            galaxyPlayMode: playMode,
            galaxyLicenseCheckout: licenseCheckout ? 'enabled' : 'disabled',
            galaxyDraftCatalog: draftCatalog ? 'enabled' : 'disabled',
            galaxyPrivacyPolicy: privacyPolicy,
            galaxyUmpTestDevice: '',
            galaxyUmpGeography: '',
        ])
    }
    buildTypes {
        debug {
            manifestPlaceholders.putAll([
                galaxyPurchaseServer: '',
                galaxyLicenseCheckout: 'disabled',
                galaxyDraftCatalog: 'disabled',
                galaxyUmpTestDevice: umpTestDevice,
                galaxyUmpGeography: umpGeography,
            ])
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
