name: Godot checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          binary=Godot_v4.7.2-stable_linux.x86_64
          curl --fail --location --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$binary.zip" -o "$binary.zip"
          printf '%s  %s\n' \
            9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65 \
            "$binary.zip" | sha512sum --check -
          unzip -q "$binary.zip"
          printf 'GODOT_BIN=%s/%s\n' "$RUNNER_TEMP" "$binary" >> "$GITHUB_ENV"
      - name: Play the mission headlessly
        run: bash tests/run.sh --full-mission
      - name: Check verified Play deliveries
        run: python3 -m unittest discover -s server -v
